<!DOCTYPE html>
<html lang="tg"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Соҳиб — EV ЗАРЯДКА</title><meta name="evrole" content="sohib"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="shortcut icon" href="favicon.ico"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><link rel="manifest" href="manifest-sohib.webmanifest"><meta name="apple-mobile-web-app-title" content="EV Соҳиб"><meta name="theme-color" content="#0d6b2f">
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#14202b;--mu:#667;--g:#2e9d57;--y:#f0b400;--r:#d9363e;--b:#3b7ddd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101418;--card:#1b222a;--tx:#eef2f5;--mu:#9aa5b0}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;padding:10px}
h1{font-size:18px;margin:4px 0 8px}h3{margin:6px 0}
nav{display:flex;gap:6px;margin-bottom:10px}
button{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;background:var(--b);color:#fff;cursor:pointer}
button.s{background:var(--mu)}button.rd{background:var(--r)}button.gr{background:var(--g)}
nav button{flex:1;background:var(--card);color:var(--tx)}nav button.on{background:var(--b);color:#fff}
input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--mu);background:var(--card);color:var(--tx);font:inherit;margin:4px 0}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.col{background:var(--card);border-radius:10px;padding:4px;display:flex;flex-direction:column;gap:4px;text-align:center}
.col b{font-size:11px;color:var(--mu)}
.cell{border-radius:8px;min-height:92px;padding:3px;font-size:11px;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;border:3px solid transparent;word-break:break-all}
.g{background:var(--g)}.y{background:var(--y);color:#222}.b{background:var(--b)}.q{border-color:var(--r)}
.blink{background:var(--g);animation:bl 1s infinite}@keyframes bl{50%{opacity:.45}}
.cell .c{font-size:22px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:4px;border-bottom:1px solid #8884;text-align:left}
#modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}
#modal[hidden]{display:none}.box{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.row{display:flex;gap:6px;margin-top:8px}.row button{flex:1}.mu{color:var(--mu);font-size:12px}
.lg{font-size:12px;max-height:150px;overflow:auto}
.scene{transform:perspective(480px) rotateX(30deg);transform-origin:50% 100%;background:linear-gradient(#667,#2a2f36);border-radius:12px;padding:8px 4px 12px;margin:10px 0 18px;box-shadow:0 14px 18px #0006}
.wall{height:12px;border-radius:6px;background:linear-gradient(#ddd,#777);margin-bottom:2px}
.urow,.ql{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.unit{display:flex;flex-direction:column;align-items:center}
.post{width:12px;height:34px;background:linear-gradient(90deg,#ccc,#666);border-radius:4px 4px 2px 2px;margin-bottom:-6px;position:relative;z-index:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:100%;filter:drop-shadow(0 6px 4px #0007)}
.sp{height:76px;font-size:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;clip-path:polygon(10% 0,100% 0,90% 100%,0 100%);overflow:hidden;line-height:1.2}
.sp.g{background:linear-gradient(#7dffa6,#1fd35a);color:#063;font-weight:700}.sp.y{background:linear-gradient(#ffe45c,#f0a800);color:#222}.sp.b{background:linear-gradient(#6aa8ff,#2f6fd6);color:#fff}.sp.x{background:linear-gradient(#999,#555);color:#fff}.sp.pk{background:linear-gradient(#ffb6d5,#ff5c9d);color:#fff;font-weight:700}.sp.blink{background:#ffd23c;color:#222;animation:bl2 1s infinite}@keyframes bl2{50%{background:#5dff8f}}.post::after{content:"";position:absolute;top:6px;left:3px;width:6px;height:6px;border-radius:50%;background:#5dff8f;box-shadow:0 0 6px #5dff8f}
.sp .c{font-size:20px}
.ql{margin-top:18px}.qs{height:62px;background:#d9363e55;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;clip-path:polygon(10% 0,100% 0,90% 100%,0 100%)}.qs.f{background:linear-gradient(#ff7a7a,#d9363e);color:#fff}.qs .c{font-size:18px}
@media print{body>*:not(#modal){display:none}#modal{position:static;background:none}.noprint{display:none}.box{max-height:none;color:#000;background:#fff}}
</style></head><body>

function doBlk(i){const k=S.block.indexOf(i);if(k>=0){S.block.splice(k,1);L(lab(i)+' кушода шуд');offNext(i)}else{S.block.push(i);L(lab(i)+' маҳкам шуд')}closeM();all()}
function offNext(i){if(S.slots[i]||S.block.includes(i)||resvd(i))return;const c=S.q.find(e=>!e.offer&&e.pref==i)||S.q.find(e=>!e.offer);if(c){c.offer={slot:i,until:Date.now()+3e5};L('Навбат ба '+c.car+' расид ('+lab(i)+')');ntf(dtop(c.phone),'⚡ Навбати шумо расид · '+stn(),'Калонка '+lab(i)+' холӣ шуд. Дар 5 дақиқа ҷавоб диҳед.','?st='+ST)}}
function offM(r){mod('<h3>Навбати шумо расид!</h3><p>Калонка '+lab(r.offer.slot)+' холӣ шуд. Ои мехоҳед пур кунед?</p><p class="mu">Агар 5 дақиқа ҷавоб надиҳед, худкор рад мешавад.</p><div class="row"><button class="gr" onclick="accO()">Ҳа</button><button class="rd" onclick="decO()">Не</button></div>')}
function accO(){const r=S.q.find(e=>e.phone==S.me.phone&&e.offer);if(r)chM(r.offer.slot)}
function decO(){const r=S.q.find(e=>e.phone==S.me.phone&&e.offer);if(r){S.q=S.q.filter(e=>e!==r);L(r.car+' навбатро рад кард');offNext(r.offer.slot)}closeM();all()}
function closeShift(){if(S.req.length)return msg('Аввал дархостҳоро Қабул ё Рад кунед');if(S.slots.some(Boolean))return msg('Аввал ҳамаи калонкаҳоро бо «Итмом» пӯшед');mod('<h3>Рамзи пӯшидани смена</h3><input id="cc" type="password" inputmode="numeric" placeholder="Рамз"><div class="row"><button class="rd" onclick="doClose()">Пӯшидани смена</button><button class="s" onclick="closeM()">Бекор</button></div>')}
function doClose(){if($('cc').value!=S.code)return msg('Рамз нодуруст');if(S.slots.some(Boolean))return msg('Аввал ҳамаи калонкаҳоро бо «Итмом» пӯшед');
 S.arch.push({d:Date.now(),from:S.shiftStart,ses:S.ses.slice(),log:S.log.slice()});S.shiftStart=Date.now();const i=S.arch.length-1;S.ses=[];S.log=[];S.q=[];save();inv(i,true);stat();live()}
function inv(i,wa){const a=S.arch[i],t=a.ses.reduce((x,s)=>({m:x.m+s.min,p:x.p+s.p1-s.p0,$:x.$+s.sum}),{m:0,p:0,$:0});
 const txt='⚡ Накладной — '+new Date(a.d).toLocaleDateString('ru')+'\n'+a.ses.map((s,n)=>(n+1)+'. '+s.car+' · '+s.min+' дақ · '+s.p0+'→'+s.p1+'% · '+s.sum+' с.').join('\n')+'\nҶамъ: '+a.ses.length+' мошин, '+t.m+' дақ, '+t.p+'%, '+t.$+' сомонӣ'+(a.log&&a.log.length?'\n\nВоқеаҳо:\n'+a.log.map(l=>hm(l.t)+' '+l.x).join('\n'):'');
 mod('<h3>Накладной · '+new Date(a.d).toLocaleDateString('ru')+'</h3><p class="mu">Смена: '+(a.from?new Date(a.from).toLocaleString('ru'):'')+' → '+new Date(a.d).toLocaleString('ru')+'</p><table><tr><th>#</th><th>Мошин</th><th>Вақт</th><th>Дақ</th><th>%</th><th>Пул</th></tr>'+a.ses.map((s,n)=>'<tr><td>'+(n+1)+'</td><td>'+esc(s.car)+'</td><td>'+hm(s.t0)+'–'+hm(s.t1)+'</td><td>'+s.min+'</td><td>'+s.p0+'→'+s.p1+'</td><td>'+s.sum+'</td></tr>').join('')+'<tr><th colspan="3">Ҷамъ</th><th>'+t.m+'</th><th>'+t.p+'</th><th>'+t.$+'</th></tr></table>'+(a.log&&a.log.length?'<h3>Воқеаҳо</h3><div class="mu">'+a.log.map(l=>hm(l.t)+' — '+l.x).join('<br>')+'</div>':'')+'<div class="row noprint"><button onclick="window.print()">PDF / Чоп</button><a style="flex:1;display:flex" href="https://wa.me/'+S.wa+'?text='+encodeURIComponent(txt)+'" target="_blank" rel="noopener"><button class="gr" style="flex:1">WhatsApp</button></a></div><div class="row noprint"><button class="s" onclick="closeM()">Пӯшидан</button></div>'+(S.wa?'':'<p class="mu noprint">Рақами WhatsApp-ро дар Танзимот ворид кунед.</p>'))}
setInterval(()=>{let ch=false;const n=Date.now();if(T==2){const a=S.rc.length;S.rc=S.rc.filter(r=>r.exp>n);if(S.rc.length!=a)ch=true;S.res.filter(x=>x.until<=n).forEach(x=>{S.res=S.res.filter(y=>y!==x);L('⚠️ '+x.car+' ('+x.phone+') '+lab(x.slot)+' — забт гузашт, ронанда наомад');ntp({id:n+x.slot,phone:x.phone,x:'⌛ Вақти забт ('+lab(x.slot)+') гузашт, калонка озод шуд.',exp:n+6e5});offNext(x.slot);ch=true})}
 if(T==2)S.q.slice().forEach(e=>{if(e.offer&&n>e.offer.until){S.q=S.q.filter(x=>x!==e);L('⚠️ '+e.car+' ('+e.phone+') ба вақт наомад — худкор рад шуд');offNext(e.offer.slot);ch=true}});
 if(ch){save();stat()}
 if(T==1&&S.me&&$('modal').hidden){const r=S.q.find(e=>e.phone==S.me.phone&&e.offer);if(r)offM(r)}
 live()},1000);
$('nav').style.display='none';try{if(window.Notification&&Notification.permission=='granted')navigator.serviceWorker.register('sw.js')}catch(e){}
const SS=ses();
if(ROLE&&!(SS&&SS.role==ROLE&&SS.st==ST)){if(SS&&SS.role==ROLE)location.search='?'+ROLE+'&st='+SS.st;else loginUI()}
else{T=ROLE=='kassir'?2:ROLE=='sohib'?3:1;adm=ROLE=='sohib';tab(T);conn()}
